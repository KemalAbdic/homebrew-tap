name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate formula syntax
        run: |
          for f in Formula/*.rb; do
            echo "Validating $f..."
            ruby -c "$f"
          done
